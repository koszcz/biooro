<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>PROTOTYPE · Isometric office look</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#20242b;font-family:system-ui,sans-serif}
  canvas{display:block}
  #hud{position:fixed;top:12px;left:12px;max-width:340px;background:rgba(255,255,255,.92);border-radius:8px;padding:10px 12px;font-size:12px;line-height:1.45;color:#222;box-shadow:0 2px 10px rgba(0,0,0,.3)}
  #hud h1{font-size:13px;margin:0 0 4px}
  #hud .warn{color:#a33;font-weight:600}
  #hud button{font-size:11px;margin:2px 2px 0 0;padding:2px 6px;cursor:pointer}
  #hud table{border-collapse:collapse} #hud td{padding:0 8px 0 0}
  #switcher{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:10px;align-items:center;background:#ff2bd6;color:#fff;font:600 13px system-ui;padding:8px 14px;border-radius:999px;box-shadow:0 4px 14px rgba(0,0,0,.5);user-select:none}
  #switcher button{background:#fff;color:#ff2bd6;border:0;border-radius:999px;width:26px;height:26px;font-weight:700;cursor:pointer}
</style>
</head>
<body>
<div id="hud"></div>
<div id="switcher"><button id="prev">←</button><span id="vlabel"></span><button id="next">→</button></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
