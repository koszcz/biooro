<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>PROTOTYPE · Character and art direction</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#20242b;font-family:system-ui,sans-serif}
  canvas{display:block}
  #panel{position:fixed;top:12px;left:12px;width:250px;background:rgba(255,255,255,.93);border-radius:8px;padding:10px 12px;font-size:12px;line-height:1.45;color:#222;box-shadow:0 2px 10px rgba(0,0,0,.3)}
  #panel h1{font-size:13px;margin:0 0 6px}
  #panel h2{font-size:11px;margin:8px 0 3px;text-transform:uppercase;letter-spacing:.05em;color:#666}
  #panel button{font-size:11px;margin:2px 2px 0 0;padding:3px 7px;cursor:pointer;border:1px solid #bbb;background:#fff;border-radius:4px}
  #panel button.on{background:#ff2bd6;color:#fff;border-color:#ff2bd6}
  #panel label{display:block}
  #legend{position:fixed;bottom:12px;left:12px;background:rgba(255,255,255,.93);border-radius:8px;padding:8px 12px;font-size:12px;line-height:1.5;color:#222}
  .sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
  .tag{position:fixed;transform:translate(-50%,-100%);background:rgba(20,22,26,.85);color:#fff;font-size:11px;padding:2px 6px 2px 5px;border-radius:4px;white-space:nowrap;pointer-events:none}
  .tag i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
  .tag small{opacity:.65;margin-left:4px}
</style>
</head>
<body>
<div id="panel"></div>
<div id="legend"></div>
<div id="tags"></div>
<script type="module" src="/src/art.ts"></script>
</body>
</html>
