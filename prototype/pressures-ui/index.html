<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>PROTOTYPE · Pressures and Task inbox UI</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#20242b;font-family:system-ui,sans-serif}
  canvas{display:block}
  #hud,#switcher{display:none}
  #ctl{position:fixed;bottom:12px;right:10px;max-width:300px;background:#ff2bd6;color:#fff;font:11px system-ui;padding:6px 8px;border-radius:8px;z-index:20;box-shadow:0 2px 10px rgba(0,0,0,.4)}
  #ctl button{font:11px system-ui;margin:3px 3px 0 0;cursor:pointer}
  #ctl pre{background:#fff;color:#222;max-height:45vh;overflow:auto;font-size:10px;padding:4px;margin:4px 0 0}
  #ctl .fired{background:#000;padding:3px;margin-top:4px;font-weight:700}
  #ctl .toast{background:rgba(255,255,255,.9);color:#222;padding:3px;margin-top:4px;border-radius:4px}
  #ui-switcher{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:10px;align-items:center;background:#ff2bd6;color:#fff;font:600 13px system-ui;padding:8px 14px;border-radius:999px;box-shadow:0 4px 14px rgba(0,0,0,.5);user-select:none;z-index:20}
  #ui-switcher button{background:#fff;color:#ff2bd6;border:0;border-radius:999px;width:26px;height:26px;font-weight:700;cursor:pointer}
</style>
</head>
<body>
<!-- the scene module still writes to these; they stay hidden -->
<div id="hud"></div>
<div id="switcher"><button id="prev"></button><span id="vlabel"></span><button id="next"></button></div>
<div id="ui"></div>
<div id="ctl"></div>
<div id="ui-switcher"><button id="ui-prev">←</button><span id="ui-label"></span><button id="ui-next">→</button></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
