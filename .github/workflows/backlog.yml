# Publish the backlog page to GitHub Pages.
# It rebuilds the page from .scratch/ on every push to main that changes a ticket.
name: Backlog page

on:
  push:
    branches: [main]
    paths:
      - ".scratch/**"
      - "scripts/backlog.py"
      - "scripts/backlog.html"
      - "scripts/frontier.py"
      - ".github/workflows/backlog.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # The page shows when each ticket last changed.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python3 scripts/backlog.py _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
